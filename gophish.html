<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media Security Awareness Lab</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #1c1e21;
        }

        .training-banner {
            background: #fff3cd;
            color: #664d03;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }

        .main {
            display: flex;
            min-height: 90vh;
        }

        /* LEFT SIDE */

        .left {
            width: 52%;
            padding: 42px 38px;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: #0866ff;
            border-radius: 50%;
            color: white;
            font-size: 55px;
            font-weight: bold;
            text-align: center;
            line-height: 68px;
        }

        .hero {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .hero h1 {
            font-size: clamp(34px, 4vw, 56px);
            line-height: 1.15;
            letter-spacing: -2px;
            max-width: 350px;
        }

        .hero h1 span {
            color: #0866ff;
        }

        .collage {
            width: 48%;
            height: 380px;
            position: relative;
        }

        .photo {
            position: absolute;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 5px 15px #0002;
        }

        .photo1 {
            width: 180px;
            height: 235px;
            background: linear-gradient(135deg, #ffcfad, #e9a5a0);
            top: 50px;
            left: 0;
        }

        .photo2 {
            width: 190px;
            height: 280px;
            background: linear-gradient(135deg, #5ec9e9, #176a9e);
            top: 0;
            right: 0;
        }

        .photo3 {
            width: 135px;
            height: 150px;
            background: linear-gradient(135deg, #a52a39, #f1b0a5);
            bottom: 5px;
            left: 35px;
            border: 9px solid white;
        }

        .heart {
            position: absolute;
            right: -5px;
            bottom: 55px;
            font-size: 48px;
        }

        /* RIGHT SIDE */

        .right {
            width: 48%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
        }

        .login-card h2 {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .field {
            width: 100%;
            padding: 19px 17px;
            border: 1px solid #ccd0d5;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 15px;
            background: #f7f8fa;
        }

        .field:focus {
            outline: 2px solid #0866ff;
        }

        .login-btn {
            width: 100%;
            background: #0866ff;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot {
            display: block;
            text-align: center;
            margin: 25px 0 55px;
            color: #1877f2;
            text-decoration: none;
        }

        .create-btn {
            display: block;
            width: 100%;
            padding: 13px;
            border: 1px solid #0866ff;
            color: #0866ff;
            border-radius: 30px;
            text-align: center;
            text-decoration: none;
        }

        .meta {
            text-align: center;
            margin-top: 25px;
            color: #34465d;
            font-size: 18px;
        }

        @media(max-width:850px) {
            .main {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                min-height: 430px;
            }

            .right {
                padding: 30px 20px;
            }

            .collage {
                transform: scale(.8);
            }
        }
    </style>
</head>

<body>
    <div class="training-banner"> </div>

    <div class="main">
        <section class="left">
            <div class="logo">f</div>

            <div class="hero">
                <h1>Explore<br />
                    the things<br />
                    <span>you love.</span>
                </h1>

                <div class="collage">
                    <div class="photo photo1">🧶</div>

                    <div class="photo photo2">🛹</div>

                    <div class="photo photo3">🎴</div>

                    <div class="heart">❤️</div>
                </div>
            </div>
        </section>

        <section class="right">
            <div class="login-card">
                <h2>Facebook Authentication</h2>

                <form id="demoForm" action=""><input autocomplete="off" class="field" id="demoUsername"
                        placeholder="Enter username" required="" type="text" /> <input autocomplete="new-password"
                        class="field" id="demoPassword" placeholder="Enter password" required="" type="password"
                        name="password" /><button class="login-btn" type="submit">Log in</button></form>
                <a class="forgot" href="https://www.facebook.com/">Forgotten password? </a> <a class="create-btn"
                    href="https://www.facebook.com/"> Visit Official Facebook </a>

                <div class="meta">∞ Meta-inspired demonstration</div>
            </div>
        </section>
    </div>
    <script>
        document.getElementById("demoForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                const username =
                    document.getElementById("demoUsername").value;

                const password =
                    document.getElementById("demoPassword").value;

                if (!username || !password) {
                    return;
                }

                // Demonstration only:
                // Do not store or transmit either value.
                document.getElementById("demoUsername").value = "";
                document.getElementById("demoPassword").value = "";

                alert(
                    "CYBERSECURITY AWARENESS ALERT!\n\n" +
                    "You interacted with a simulated login page.\n\n" +
                    "Never enter real credentials on unfamiliar websites."
                );

                window.location.href = "https://www.facebook.com/";

            });
    </script>

</body>

</html>
